# Blueprint de Render: https://render.com/docs/blueprint-spec
# Crea la base PostgreSQL y el servicio web (API + frontend compilado) desde el Dockerfile.
#
# Este blueprint levanta la DEMOSTRACIÓN (SEED_DEMO=1: datos de ejemplo y el
# código de verificación en pantalla). Para producción: SEED_DEMO=0,
# SMS_PROVEEDOR=twilio con sus credenciales y el primer administrador
# (EMPRESA_NOMBRE, ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_TELEFONO). Lista completa
# en docs/PRODUCCION.md. Las reglas de negocio ya no van aquí: se configuran en
# la aplicación (Configuración → Empresa).
databases:
  - name: facturacion-db
    plan: free
    databaseName: facturas
    user: facturas

services:
  - type: web
    name: facturacion
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: facturacion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: COOKIE_SEGURA
        value: "1"
      # Render atiende detrás de su propio proxy: la IP real del usuario llega en X-Forwarded-For
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DOS_PASOS
        value: "1"
      - key: SMS_PROVEEDOR
        value: consola
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: EMPRESA_NOMBRE
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TELEFONO
        sync: false
