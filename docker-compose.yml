# Instalación con PostgreSQL.
#   Demostración:  docker compose up            (usa backend/.env.demo)
#   Producción:    copie backend/.env.example como backend/.env, complételo y
#                  ENV_FILE=backend/.env docker compose up -d
# Guía: docs/PRODUCCION.md
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: facturas
      POSTGRES_USER: facturas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facturas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturas"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ${ENV_FILE:-backend/.env.demo}
    environment:
      DATABASE_URL: postgresql+psycopg://facturas:${POSTGRES_PASSWORD:-facturas}@db:5432/facturas
    volumes:
      - archivos:/data/archivos
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  archivos:
