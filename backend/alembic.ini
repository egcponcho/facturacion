# Migraciones de la base de datos (Alembic). La URL sale de DATABASE_URL (app.config).
#   alembic upgrade head                      aplica las migraciones pendientes
#   alembic revision --autogenerate -m "..."  crea una migración con los cambios del modelo
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
