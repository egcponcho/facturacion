# Reglas de estilo del backend: `ruff check app tests` (y `--fix` para ordenar imports)
line-length = 120
target-version = "py312"
extend-exclude = ["app/data", "alembic/versions"]

[lint]
# F: errores (nombres sin definir, imports sin usar); E9: sintaxis; I: orden de imports;
# B: errores frecuentes (argumentos mutables por defecto, excepciones mal encadenadas)
select = ["F", "E9", "I", "B"]
# B008: FastAPI declara dependencias con Depends()/Query() en los argumentos
ignore = ["B008"]

[lint.isort]
known-first-party = ["app"]
